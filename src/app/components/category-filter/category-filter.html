<aside class="filters" [class.filters-open]="isOpen">
  <div class="filters-header">
    <h2 class="filters-title">Filters</h2>
    
    <button class="filters-icon-btn" (click)="onClose()" aria-label="Close filters">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
      </svg>
    </button>
  </div>

  <div class="filters-divider"></div>

  <!-- Categories -->
  <ul class="filter-categories">
    @for (cat of categories; track cat) {
      <li class="filter-category-item">
        <span>{{ cat }}</span>
        <svg class="icon-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </li>
    }
  </ul>

  <div class="filters-divider"></div>

  <!-- Price Slider -->
  <div class="filter-group">
    <div class="filter-group-header">
      <h3 class="filter-group-title">Price</h3>
      <svg class="icon-chevron-up" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
      </svg>
    </div>
    <input type="range" min="50" max="300" value="200" class="price-slider" />
    <div class="price-labels">
      <span>$50</span>
      <span>$200</span>
    </div>
  </div>

  <div class="filters-divider"></div>

  <!-- Colors -->
  <div class="filter-group">
    <div class="filter-group-header">
      <h3 class="filter-group-title">Colors</h3>
      <svg class="icon-chevron-up" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
      </svg>
    </div>
    <div class="color-grid">
      @for (color of colors; track color) {
        <button 
          class="color-swatch" 
          [style.background-color]="color"
          [class.color-swatch-white]="color === '#FFFFFF'"
          [class.color-swatch-active]="selectedColor === color"
          (click)="selectedColor = color">
          @if (selectedColor === color) {
            <svg viewBox="0 0 20 20" fill="currentColor" class="color-check">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
          }
        </button>
      }
    </div>
  </div>

  <div class="filters-divider"></div>

  <!-- Sizes -->
  <div class="filter-group">
    <div class="filter-group-header">
      <h3 class="filter-group-title">Size</h3>
      <svg class="icon-chevron-up" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
      </svg>
    </div>
    <div class="size-grid">
      @for (size of sizes; track size) {
        <button 
          class="size-pill" 
          [class.size-pill-active]="selectedSize === size"
          (click)="selectedSize = size">
          {{ size }}
        </button>
      }
    </div>
  </div>

  <div class="filters-divider"></div>

  <!-- Dress Style -->
  <div class="filter-group">
    <div class="filter-group-header">
      <h3 class="filter-group-title">Dress Style</h3>
      <svg class="icon-chevron-up" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
      </svg>
    </div>
    <ul class="filter-categories">
      @for (style of dressStyles; track style) {
        <li class="filter-category-item">
          <span>{{ style }}</span>
          <svg class="icon-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </li>
      }
    </ul>
  </div>

  <button class="apply-filter-btn">Apply Filter</button>
</aside>
